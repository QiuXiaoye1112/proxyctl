name: ProxyCTL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash jq openssl util-linux iproute2 net-tools curl python3 tar unzip

      - name: Bash syntax
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Core smoke
        run: bash tests/smoke.sh

      - name: Installer transaction
        run: sudo bash tests/installer.sh

      - name: System abstraction
        run: bash tests/system.sh

      - name: Service abstraction
        run: bash tests/service.sh

      - name: Network utilities
        run: bash tests/network.sh

      - name: Port utilities
        run: bash tests/port.sh

      - name: Locking
        run: bash tests/lock.sh

      - name: Lock security
        run: bash tests/lock_security.sh

      - name: Config transactions
        run: bash tests/transaction.sh

      - name: Certificates
        run: bash tests/certificate.sh

      - name: Portable backup
        run: bash tests/backup.sh

      - name: Phase 2 integration
        run: bash tests/integration.sh

      - name: Core lifecycle adapters
        run: bash tests/engine_lifecycle.sh

      - name: Inbound lifecycle
        run: bash tests/inbounds.sh

      - name: Hardened sing-box users
        run: bash tests/singbox_clients.sh

      - name: Inbound edits and user rename
        run: bash tests/inbound_edit.sh

      - name: Restore runtime synchronization
        run: bash tests/runtime.sh

  real-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash jq openssl curl unzip ca-certificates

      - name: Install Xray 26.7.11
        run: |
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/xray-install.sh
          sudo bash /tmp/xray-install.sh install --version 26.7.11
          sudo systemctl stop xray.service || true
          xray version

      - name: Install sing-box 1.13.12
        run: |
          curl -fsSL --retry 3 https://sing-box.app/install.sh -o /tmp/sing-box-install.sh
          sudo bash /tmp/sing-box-install.sh --version 1.13.12
          sudo systemctl stop sing-box.service || true
          sing-box version

      - name: Validate every Phase 3 protocol with real cores
        run: bash tests/protocols_real.sh
