name: Backup Debug
on:
  pull_request:
permissions:
  contents: write
jobs:
  backup:
    if: github.head_ref == 'ci/phase4-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/phase4-validation
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bash jq openssl util-linux iproute2 net-tools curl tar
      - name: Capture backup failure context
        run: |
          set +e
          bash -x tests/backup.sh > /tmp/backup-trace.log 2>&1
          rc=$?
          {
            echo "rc=$rc"
            grep -n -B 14 -A 22 'FAIL:' /tmp/backup-trace.log || true
            echo '--- tail ---'
            tail -n 40 /tmp/backup-trace.log
          } > .github/backup-failure.txt
          exit 0
      - name: Commit diagnostic context
        run: |
          git config user.name 'proxyctl-ci'
          git config user.email 'proxyctl-ci@users.noreply.github.com'
          git add .github/backup-failure.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture backup validation failure [skip ci]'
          git push origin HEAD:ci/phase4-validation
